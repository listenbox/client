language: rust
layer: application
toolchains:
  default: rust
env:
  CARGO_TERM_COLOR: always
dependsOn: ['client']
taskOptions:
  cache: true
fileGroups:
  sources:
    - src/**/*.rs
    - tests/**/*
    - Cargo.toml
tasks:
  build:
    deps: [client:prerequisites, client-engine:build]
    inputs: ['@group(sources)', 'project://client?group=sources']
    script: |-
      set -euo pipefail
      cargo build --locked -p listenbox
      mkdir -p dist
      cp ../../target/debug/listenbox dist/listenbox
    outputs: [dist/listenbox]
  test:
    deps: [client:prerequisites]
    inputs: ['@group(sources)', 'project://client?group=sources']
    command: cargo test --locked -p listenbox
