language: rust
layer: application
toolchains:
  default: rust
env:
  CARGO_TERM_COLOR: always
dependsOn: ['client']
taskOptions:
  cache: true
fileGroups:
  sources:
    - src/**/*.rs
    - tests/**/*
    - Cargo.toml
tasks:
  build:
    deps: [client:prerequisites, client-engine:build]
    inputs: ['@group(sources)', 'project://client?group=sources']
    script: |-
      set -euo pipefail
      kache cargo -- build --locked -p listenbox
      mkdir -p dist
      cp ../../target/debug/listenbox dist/listenbox
    outputs: [dist/listenbox]
  test:
    deps: [client:prerequisites]
    inputs: ['@group(sources)', 'project://client?group=sources']
    command: kache cargo -- test --locked -p listenbox
  build-release:
    description: Build the production CLI with the persistent desktop profile.
    deps: [client:prerequisites]
    inputs: ['@group(sources)', 'project://client?group=sources']
    script: |-
      set -euo pipefail
      kache cargo -- build --locked --release -p listenbox
      mkdir -p dist/release
      cp ../../target/release/listenbox dist/release/listenbox
    outputs: [dist/release/listenbox]
    options:
      runInCI: false
  prod:
    description: Build and run the CLI against production quickly; pass commands after --.
    deps: [client:prerequisites]
    preset: utility
    inputs: []
    command: kache cargo -- run --locked --profile prod -p listenbox -- --config ../../config/prod.yaml
    options:
      cache: false
      runInCI: false
