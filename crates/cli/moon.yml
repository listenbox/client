language: go
layer: application
tags: [client-component]
dependsOn: [client]
fileGroups:
  sources: ['*.go']
tasks:
  prod:
    description: Run the CLI against production using the persistent shared profile.
    deps: [client:prerequisites]
    command: [mise, -C, ../.., exec, --, go, run, '-ldflags=-X github.com/listenbox/client/crates/sync-engine.Production=1', ./crates/cli, --config, config/prod.yaml]
    inputs: []
    options:
      cache: false
      runInCI: false
  build:
    deps: [client:prerequisites]
    script: mise -C ../.. exec -- go build -buildvcs=false -o crates/cli/dist/listenbox ./crates/cli
    inputs: ['@group(sources)', 'project://client?group=sources']
    outputs: [dist/listenbox]
  build-release:
    deps: [client:prerequisites]
    script: |
      cd ../..
      version="$(cat VERSION)"
      commit="$(git rev-parse HEAD)"
      mise exec -- go build -trimpath -buildvcs=false -ldflags="-s -w -X github.com/listenbox/client/crates/sync-engine.Version=$version -X github.com/listenbox/client/crates/sync-engine.SourceCommit=$commit -X github.com/listenbox/client/crates/sync-engine.Production=1" -o crates/cli/dist/release/listenbox ./crates/cli
    inputs: ['@group(sources)', 'project://client?group=sources']
    outputs: [dist/release/listenbox]
    options:
      runInCI: false
