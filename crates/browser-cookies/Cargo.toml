[package]
name = "listenbox-browser-cookies"
version = "0.1.0"
edition = "2024"
license = "MIT"

# The extraction process owns its SQLite build independently of the sync journal.
[workspace]

[dependencies]
anyhow = "1"
rookie-cookies = { version = "=0.6.0", default-features = false }
rust-ini = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
