[package]
name = "youtubei"
version = "0.1.0"
edition = "2024"
description = "Persistent Rust bindings to youtubei.js on embedded QuickJS"
license = "MIT"
repository = "https://github.com/listenbox/client"
publish = false

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
llrt_modules = { version = "=0.8.1-beta", default-features = false, features = ["abort", "buffer", "crypto", "crypto-rust", "events", "exceptions", "fetch", "stream-web", "timers", "url", "util", "path", "intl", "tls-ring"] }
llrt_utils = { package = "llrt_utils_watts", version = "=0.8.1-beta" }
rquickjs = { version = "=0.11.0", features = ["full-async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "time", "sync", "net", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net", "io-util"] }
static_assertions = "1"
