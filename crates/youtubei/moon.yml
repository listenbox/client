language: rust
layer: library
toolchains:
  default: rust
env:
  CARGO_TERM_COLOR: always
dependsOn: ['client']
taskOptions:
  cache: true
fileGroups:
  sources:
    - src/**/*.rs
    - build.rs
    - Cargo.toml
  tests:
    - tests/**/*
tasks:
  build:
    deps:
      - target: youtubejs:bundle
        cacheStrategy: outputs
    inputs: ['@group(sources)', 'project://client?group=cargo-config']
    script: |-
      set -euo pipefail
      cargo build --locked -p youtubei
  test:
    deps:
      - target: youtubejs:bundle
        cacheStrategy: outputs
    inputs: ['@group(sources)', '@group(tests)', 'project://client?group=cargo-config']
    command: cargo test --locked -p youtubei
