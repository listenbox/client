language: rust
layer: library
toolchains:
  default: rust
env:
  CARGO_TERM_COLOR: always
dependsOn: ['client']
taskOptions:
  cache: true
fileGroups:
  sources:
    - src/**/*.rs
    - tests/**/*
    - build.rs
    - Cargo.toml
tasks:
  build:
    deps: [client:prerequisites]
    inputs: ['@group(sources)', 'project://client?group=sources']
    script: |-
      set -euo pipefail
      cargo build --locked -p youtubei
  test:
    deps: [client:prerequisites]
    inputs: ['@group(sources)', 'project://client?group=sources']
    command: cargo test --locked -p youtubei
