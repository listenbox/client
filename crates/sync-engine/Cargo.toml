[package]
name = "listenbox-sync-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
cookie = "0.18"
cookie_store = { version = "0.22", default-features = false, features = ["serde"] }
dirs = "6"
sha1 = "0.10"
ffmpeg = { package = "ffmpeg-the-third", version = "=6.0.0", default-features = false, features = ["static", "format", "software-resampling"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures-util = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
reqwest-middleware = { version = "0.4.2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
slug = "0.1.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "fs", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
youtubei = { path = "../youtubei" }
rusqlite = { version = "0.38", features = ["bundled"] }
refinery = { version = "=0.9.2", default-features = false, features = ["rusqlite"] }
parking_lot = "0.12"


[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
