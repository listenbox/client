language: rust
layer: library
toolchains:
  default: rust
env:
  CARGO_TERM_COLOR: always
dependsOn: ['client']
taskOptions:
  cache: true
fileGroups:
  sources:
    - src/**/*.rs
    - tests/**/*
    - Cargo.toml
tasks:
  build:
    deps: [client:prerequisites, client-youtubei:build]
    inputs: ['@group(sources)', 'project://client?group=sources']
    script: |-
      set -euo pipefail
      pkgx +llvm.org +cmake.org cargo build --locked -p listenbox-sync-engine
  test:
    deps: [client:prerequisites]
    inputs: ['@group(sources)', 'project://client?group=sources']
    command: pkgx +llvm.org +cmake.org cargo-nextest nextest run --locked -p listenbox-sync-engine
  test-media:
    description: Decode real AAC/Opus/AVC fixtures through the release-linked media preparation code.
    deps: [client:prerequisites]
    inputs: ['@group(sources)', 'project://client?group=sources']
    command: pkgx +llvm.org +cmake.org cargo-nextest nextest run --locked --release --profile ci --success-output immediate -p listenbox-sync-engine -E 'test(native_media_tests::) or binary(native_build)'
    options:
      runInCI: false
      cache: false
