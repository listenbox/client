language: rust
layer: library
toolchains:
  default: rust
env:
  CARGO_TERM_COLOR: always
dependsOn: ['client']
taskOptions:
  cache: true
fileGroups:
  sources:
    - src/**/*.rs
    - tests/**/*
    - Cargo.toml
tasks:
  build:
    deps: [client:prerequisites, client-youtubei:build]
    inputs: ['@group(sources)', 'project://client?group=sources']
    script: |-
      set -euo pipefail
      kache cargo -- build --locked -p listenbox-sync-engine
  test:
    deps: [client:prerequisites]
    inputs: ['@group(sources)', 'project://client?group=sources']
    command: kache cargo -- nextest run --locked -p listenbox-sync-engine
  build-e2e:
    description: Build sync fixtures used by the parent API's integrated recovery proofs.
    deps: [client:prerequisites]
    inputs: ['@group(sources)', 'project://client?group=sources']
    script: |-
      set -euo pipefail
      mkdir -p dist
      kache cargo -- test --locked -p listenbox-sync-engine --test v1_journal --test network_recovery --no-run --message-format=json > dist/test-build.json
      for fixture in v1_journal network_recovery; do
        executable="$(jq -r --arg fixture "$fixture" 'select(.reason == "compiler-artifact" and .profile.test and .target.name == $fixture and .executable != null) | .executable' dist/test-build.json)"
        test -n "$executable"
        if [ "$fixture" = v1_journal ]; then
          cp "$executable" dist/listenbox-journal-e2e
        else
          cp "$executable" dist/listenbox-network-e2e
        fi
      done
    outputs: [dist/listenbox-journal-e2e, dist/listenbox-network-e2e]
  test-media:
    description: Decode real AAC/Opus/AVC fixtures through the release-linked media preparation code.
    deps: [client:prerequisites]
    inputs: ['@group(sources)', 'project://client?group=sources']
    command: kache cargo -- nextest run --locked --release --profile ci --success-output immediate -p listenbox-sync-engine -E 'test(native_media_tests::) or binary(native_build)'
    options:
      runInCI: false
      cache: false
  test-hls:
    description: Validate complete multi-segment desktop HLS packages with Apple mediastreamvalidator.
    deps: [client:prerequisites]
    inputs: ['@group(sources)', 'project://client?group=sources']
    command: kache cargo -- nextest run --locked --release --profile ci --success-output immediate -p listenbox-sync-engine --run-ignored only -E 'test(native_media_tests::apple_hls_)'
    options:
      cache: false
      os: [macos, linux]
