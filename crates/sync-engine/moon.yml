language: go
layer: library
tags: [client-component]
dependsOn: [client]
fileGroups:
  sources: ['**/*.go', '**/*.sql', 'tests/fixtures/**/*']
tasks:
  build:
    deps: [client:prerequisites]
    command: mise -C ../.. exec -- go build ./crates/sync-engine
    inputs: ['@group(sources)', 'project://client?group=sources']
  build-e2e:
    deps: [client:prerequisites]
    script: |
      mise -C ../.. exec -- go test -c -o crates/sync-engine/dist/listenbox-network-e2e ./crates/sync-engine
      cp dist/listenbox-network-e2e dist/listenbox-journal-e2e
    inputs: ['@group(sources)', 'project://client?group=sources']
    outputs: [dist/listenbox-network-e2e, dist/listenbox-journal-e2e]
