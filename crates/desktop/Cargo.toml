[package]
name = "listenbox-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
hot-reload = ["dep:dioxus-devtools"]
native-updater = []

[build-dependencies]
cc = "1"
embed-resource = "3"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
resvg = { version = "0.46", default-features = false }

[dependencies]
dioxus-devtools = { version = "=0.7.10", optional = true }
listenbox-sync-engine = { path = "../sync-engine" }
gpui-kit = "=0.6.6"
anyhow = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "=0.25.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSWindow"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGEventSource", "CGEventTypes", "CGRemoteOperation"] }

[dev-dependencies]
gpui-kit = { version = "=0.6.6", features = ["test-support"] }
futures-util = "0.3"
tempfile = "3"
serde_json = "1"

[lints]
workspace = true
