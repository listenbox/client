language: go
layer: application
tags: [client-component]
dependsOn: [client]
fileGroups:
  sources: ['*.go', 'assets/**/*', 'mygo.template.json', 'tests/fixtures/**/*']
tasks:
  package:
    description: Build the native desktop bundle with MyGo's distribution tools.
    deps: [client:prerequisites, client:updaters, ~:build-config]
    command: [mise, -C, ../.., exec, --, go, tool, mygo, build, -skip-installer, crates/desktop]
    inputs: ['@group(sources)', 'project://client?group=sources']
    options:
      runInCI: false
  build-config:
    description: Generate MyGo packaging metadata from VERSION and the platform release environment.
    command: [mise, -C, ../.., exec, --, node, --input-type=module, -e]
    args:
      - |
          import {readFileSync,writeFileSync} from "node:fs";
          import {execFileSync} from "node:child_process";
          const base="crates/desktop/";
          const c=JSON.parse(readFileSync(base+"mygo.template.json","utf8"));
          c.version=readFileSync("VERSION","utf8").trim();
          const key=process.env.LISTENBOX_UPDATE_PUBLIC_KEY||"";
          if(process.platform==="win32"){
            c.name="listenbox-desktop";
            const arch=process.arch==="arm64"?"ARM64":"x64";
            c.resources.push("../../.cache/updaters/WinSparkle-0.9.4/"+arch+"/Release/WinSparkle.dll","../../.cache/updaters/WinSparkle-0.9.4/COPYING","../../.cache/updaters/WinSparkle-0.9.4/COPYING.expat");
          }
          if(process.platform==="darwin"){
            c.macos.signingIdentity=process.env.LISTENBOX_SIGNING_IDENTITY||"-";
            c.macos.infoPlist.ListenboxSourceCommit=process.env.LISTENBOX_SOURCE_COMMIT||execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim();
            if(key){
              c.resources.push("../../.cache/updaters/Sparkle.framework","../../.cache/updaters/Sparkle.LICENSE.txt");
              Object.assign(c.macos.infoPlist,{SUPublicEDKey:key,SUFeedURL:"https://github.com/listenbox/client/releases/latest/download/appcast-macos-arm64.xml",SUEnableAutomaticChecks:true,SUAutomaticallyUpdate:true,SUShowReleaseNotes:false,SUUpdateCheckInterval:86400});
            }
            if(process.env.LISTENBOX_PRODUCTION_RELEASE==="1"){
              if(!key||!process.env.LISTENBOX_NOTARY_PROFILE||!process.env.LISTENBOX_SIGNING_KEYCHAIN)throw Error("Production packaging requires the existing update key and imported Apple signing profile");
              c.macos.notarize={keychainProfile:process.env.LISTENBOX_NOTARY_PROFILE,keychain:process.env.LISTENBOX_SIGNING_KEYCHAIN};
            }
          }
          writeFileSync(base+"mygo.json",JSON.stringify(c,null,2)+"\n");
    inputs: [mygo.template.json, 'project://client?group=version']
    outputs: [mygo.json]
    options:
      cache: false
      internal: true
      shell: false
  build:
    deps: [client:prerequisites]
    script: mise -C ../.. exec -- go build -buildvcs=false -o crates/desktop/dist/listenbox-desktop ./crates/desktop
    inputs: ['@group(sources)', 'project://client?group=sources']
    outputs: [dist/listenbox-desktop]
  build-e2e:
    deps: [client:prerequisites]
    command: mise -C ../.. exec -- go test -c -o crates/desktop/dist/listenbox-desktop-e2e ./crates/desktop
    inputs: ['@group(sources)', 'project://client?group=sources']
    outputs: [dist/listenbox-desktop-e2e]
  dev:
    deps: [client:prerequisites, ~:build-config]
    command: [mise, -C, ../.., exec, --, go, tool, mygo, dev, crates/desktop]
    preset: server
    inputs: []
  build-release:
    deps: [client:prerequisites, client:updaters, ~:build-config]
    command: [mise, -C, ../.., exec, --, bash, tools/build-desktop.sh, darwin/arm64]
    inputs: ['@group(sources)', 'project://client?group=sources']
    options:
      os: macos
      runInCI: false
  dmg:
    deps: [~:build-release]
    inputs: ['@group(sources)', 'project://client?group=sources']
    options:
      os: macos
      runInCI: false
  build-release-windows-x64:
    deps: [client:prerequisites, client:updaters, ~:build-config]
    command: [mise, -C, ../.., exec, --, bash, tools/build-desktop.sh, windows/amd64]
    inputs: ['@group(sources)', 'project://client?group=sources']
    options:
      os: windows
      runInCI: false
  build-release-windows-arm64:
    deps: [client:prerequisites, client:updaters, ~:build-config]
    command: [mise, -C, ../.., exec, --, bash, tools/build-desktop.sh, windows/arm64]
    inputs: ['@group(sources)', 'project://client?group=sources']
    options:
      os: windows
      runInCI: false
