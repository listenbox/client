language: rust
toolchains:
  default: system
dependsOn: ['client', 'client-engine']
taskOptions:
  cache: true
fileGroups:
  sources:
    - src/**/*.rs
    - tests/**/*
    - examples/**/*.rs
    - Cargo.toml
tasks:
  dev:
    description: Watch client sources, rebuild the debug app, and connect to local Listenbox services.
    deps: [client:prerequisites]
    preset: server
    env:
      LISTENBOX_PROFILE_DIR: $projectRoot/../../.cache/dev
      RUST_BACKTRACE: '1'
    script: |-
      set -eu
      cd ../..
      mkdir -p .cache
      cargo metadata --locked --no-deps --format-version 1 > .cache/desktop-metadata.json
      pkgx jq -er '
        INDEX(.packages[]; .manifest_path | rtrimstr("/Cargo.toml")) as $packages |
        [.packages[] | select(.name == "listenbox-desktop") |
          recurse(.dependencies[] | select(.path != null and .kind != "dev") |
            $packages[.path] // error("Local desktop dependency is not a workspace member")) |
          .manifest_path | rtrimstr("/Cargo.toml")] | unique[]
      ' .cache/desktop-metadata.json > .cache/desktop-watch-paths
      export LISTENBOX_DEV_WATCHER_PID=$$
      exec pkgx watchexec@2.7.3 --restart --debounce 300ms --stop-timeout 5s \
        --project-origin . --watch-file .cache/desktop-watch-paths \
        --watch config --watch tools \
        --watch Cargo.toml --watch Cargo.lock --watch rust-toolchain.toml \
        --watch .cargo --watch moon.yml --watch .moon/workspace.yml \
        --ignore '**/dist/**' --shell none -- sh tools/dev-desktop.sh
    options:
      cache: false
      runInCI: false
      os: macos
  preview:
    deps: [client:prerequisites]
    command: pkgx +llvm.org +cmake.org cargo run --locked -p listenbox-desktop --example preview
    options:
      runInCI: false
      cache: false
      runFromWorkspaceRoot: false
  build:
    deps: [client:prerequisites, client-engine:build]
    inputs: ['@group(sources)', 'project://client?group=sources']
    script: |-
      set -euo pipefail
      pkgx +llvm.org +cmake.org cargo build --locked -p listenbox-desktop
      mkdir -p dist
      cp ../../target/debug/listenbox-desktop dist/listenbox-desktop
    outputs: [dist/listenbox-desktop]
  build-release-windows-x64:
    description: Build and package a Windows x64 release, also runnable through Windows 11 ARM emulation.
    deps: [client:codegen, client:native-ffmpeg-windows-x64]
    command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ../../tools/build-windows.ps1 -Architecture x64 -Stage Release
    inputs: ['@group(sources)', 'project://client?group=sources', 'project://client?group=notices']
    outputs: [dist/windows-x64/**/*, dist/listenbox-desktop-windows-x64.exe, dist/listenbox-desktop-windows-x64.zip]
    options:
      os: windows
      runInCI: false
  build-release-windows-arm64:
    description: Build and package a native Windows ARM64 release on Windows ARM64.
    deps: [client:codegen, client:native-ffmpeg-windows-arm64]
    command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ../../tools/build-windows.ps1 -Architecture arm64 -Stage Release
    inputs: ['@group(sources)', 'project://client?group=sources', 'project://client?group=notices']
    outputs: [dist/windows-arm64/**/*, dist/listenbox-desktop-windows-arm64.exe, dist/listenbox-desktop-windows-arm64.zip]
    options:
      os: windows
      runInCI: false
  test:
    deps: [client:prerequisites]
    inputs: ['@group(sources)', 'project://client?group=sources']
    command: pkgx +llvm.org +cmake.org cargo test --locked -p listenbox-desktop
  build-e2e:
    deps: [client:prerequisites]
    inputs: ['@group(sources)', 'project://client?group=sources']
    script: |-
      set -euo pipefail
      mkdir -p dist
      pkgx +llvm.org +cmake.org cargo test --locked -p listenbox-desktop --no-run --message-format=json > dist/test-build.json
      executable="$(pkgx jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable != null) | .executable' dist/test-build.json)"
      test -n "$executable"
      cp "$executable" dist/listenbox-desktop-e2e
    outputs: [dist/listenbox-desktop-e2e]
