language: rust
layer: application
toolchains:
  default: rust
env:
  CARGO_TERM_COLOR: always
dependsOn: ['client']
taskOptions:
  cache: true
fileGroups:
  sources:
    - assets/**/*
    - build.rs
    - src/**/*.rs
    - src/**/*.m
    - tests/**/*
    - tools/**/*
    - Cargo.toml
tasks:
  build-profiled:
    description: Build the optimized desktop with GPUI instrumentation and dSYM symbols.
    deps: [client:prerequisites]
    inputs: ['@group(sources)', 'project://client?group=sources']
    command: bash tools/profile.sh build
    outputs: [dist/profiled/listenbox-desktop, dist/profiled/listenbox-desktop.dSYM/**/*]
    options:
      os: macos
      internal: true
      runInCI: false
  profiled:
    description: Run the optimized desktop against local services with a frame-time overlay.
    deps: [~:build-profiled]
    preset: server
    inputs: []
    command: bash tools/profile.sh launch
    options:
      cache: false
      interactive: true
      runInCI: false
      os: macos
  profile:
    description: Capture the profiled desktop; arguments are label, seconds, and cpu or metal.
    inputs: []
    command: bash tools/profile.sh capture
    options:
      cache: false
      persistent: true
      runInCI: false
      os: macos
  dev-tools:
    description: Install the pinned Subsecond build and watch driver.
    command: cargo install --locked --root dist/dev-tools dioxus-cli --version 0.7.10
    inputs: [Cargo.toml, moon.yml]
    outputs: [dist/dev-tools/bin/dx]
    options:
      runInCI: false
  dev-bundle-info:
    description: Generate the macOS development bundle's product name and current Cargo version.
    command: bash tools/dev-bundle-info.sh
    inputs: [tools/dev-bundle-info.sh, Cargo.toml, 'project://client?group=desktop-dev-config']
    outputs: [dist/dev-bundle/Info.plist]
    options:
      os: macos
      runInCI: false
  dev:
    description: Hotpatch the running desktop UI with Subsecond against local Listenbox services.
    deps: [client:prerequisites, ~:dev-tools, ~:dev-bundle-info]
    preset: server
    inputs: []
    env:
      RUST_BACKTRACE: '1'
    script: |-
      set -eu
      cd ../..
      exec crates/desktop/dist/dev-tools/bin/dx serve \
        --port 8090 --desktop --hot-patch --package listenbox-desktop --features hot-reload \
        --locked --args="--config $PWD/config/dev.yaml"
    options:
      cache: false
      interactive: true
      runInCI: false
      os: macos
  build:
    deps: [client:prerequisites, client-engine:build]
    inputs: ['@group(sources)', 'project://client?group=sources']
    script: |-
      set -euo pipefail
      cargo build --locked -p listenbox-desktop
      mkdir -p dist
      cp ../../target/debug/listenbox-desktop dist/listenbox-desktop
    outputs: [dist/listenbox-desktop]
  build-release:
    description: Build the production desktop executable for the host architecture.
    deps: [client:prerequisites, client:updaters]
    inputs: ['@group(sources)', 'project://client?group=sources', 'project://client?group=notices', '$LISTENBOX_PRODUCTION_RELEASE', '$LISTENBOX_UPDATE_PUBLIC_KEY', '$LISTENBOX_SOURCE_COMMIT']
    script: |-
      set -euo pipefail
      cd ../..
      if [[ "${LISTENBOX_PRODUCTION_RELEASE:-0}" == 1 ]]; then
        cargo build --locked --release -p listenbox-desktop --features native-updater
      else
        cargo build --locked --release -p listenbox-desktop
      fi
      mkdir -p crates/desktop/dist/release
      cp target/release/listenbox-desktop crates/desktop/dist/release/listenbox-desktop
      cp .cache/ffmpeg/NOTICE.txt crates/desktop/dist/release/FFmpeg-NOTICE.txt
      if [[ "${LISTENBOX_PRODUCTION_RELEASE:-0}" == 1 && "$OSTYPE" == darwin* ]]; then
        DYLD_FRAMEWORK_PATH="$PWD/.cache/updaters" crates/desktop/dist/release/listenbox-desktop --help
      else
        crates/desktop/dist/release/listenbox-desktop --help
      fi
    outputs: [dist/release/listenbox-desktop, dist/release/FFmpeg-NOTICE.txt]
    options:
      os: [linux, macos]
      runInCI: false
  dmg:
    description: Package the production Apple Silicon desktop executable as a macOS DMG.
    deps: [client:updaters, ~:build-release]
    inputs: [project://client?group=notices, project://client?group=sources]
    script: |-
      set -euo pipefail
      cd ../..
      mkdir -p .cache
      rustc --edition 2024 tools/package-macos.rs -o .cache/package-macos
      .cache/package-macos
    outputs: [dist/macos/*.dmg, dist/macos/image/Listenbox.app/**/*]
    options:
      os: macos
      cache: false
      runInCI: false
  macos-reinstall:
    description: Build the release and replace /Applications/Listenbox.app after gracefully stopping the installed copy.
    deps: [~:dmg]
    inputs: [project://client?group=macos-install-tools]
    script: |-
      set -euo pipefail
      cd ../..
      mkdir -p .cache
      xcrun swiftc -warnings-as-errors -parse-as-library tools/reinstall-macos.swift -o .cache/reinstall-macos
      .cache/reinstall-macos crates/desktop/dist/macos/image/Listenbox.app /Applications/Listenbox.app
    options:
      os: macos
      cache: false
      runInCI: false
  build-release-windows-x64:
    description: Build and package a Windows x64 release, also runnable through Windows 11 ARM emulation.
    deps: [client:codegen, youtubejs:bundle, client:updaters, client:native-ffmpeg-windows-x64]
    command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ../../tools/build-windows.ps1 -Architecture x64 -Stage Release
    inputs: ['@group(sources)', 'project://client?group=sources', 'project://client?group=notices']
    outputs: [dist/windows-x64/**/*]
    options:
      os: windows
      runInCI: false
      cache: false
  build-release-windows-arm64:
    description: Build and package a native Windows ARM64 release on Windows ARM64.
    deps: [client:codegen, youtubejs:bundle, client:updaters, client:native-ffmpeg-windows-arm64]
    command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ../../tools/build-windows.ps1 -Architecture arm64 -Stage Release
    inputs: ['@group(sources)', 'project://client?group=sources', 'project://client?group=notices']
    outputs: [dist/windows-arm64/**/*]
    options:
      os: windows
      runInCI: false
      cache: false
  test:
    deps: [client:prerequisites]
    inputs: ['@group(sources)', 'project://client?group=sources']
    command: cargo test --locked -p listenbox-desktop --features hot-reload
  build-e2e:
    deps: [client:prerequisites]
    inputs: ['@group(sources)', 'project://client?group=sources']
    script: |-
      set -euo pipefail
      mkdir -p dist
      cargo test --locked -p listenbox-desktop --no-run --message-format=json > dist/test-build.json
      executable="$(jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable != null) | .executable' dist/test-build.json)"
      test -n "$executable"
      cp "$executable" dist/listenbox-desktop-e2e
    outputs: [dist/listenbox-desktop-e2e]
