name: Prepare automatic desktop release
on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]
permissions:
  contents: write
  actions: write
jobs:
  prepare:
    if: >-
      github.repository == 'listenbox/client' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha == github.sha
    concurrency:
      group: desktop-release-version
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: '2026.11.7'
          install_args: node jq aube gh
      - name: Reserve the next numeric version for this source
        id: release
        run: bash tools/release-next.sh "$SOURCE_COMMIT"
      - name: Push the immutable tag and dispatch its native release
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: bash tools/release-dispatch.sh "$RELEASE_TAG" "$SOURCE_COMMIT"
