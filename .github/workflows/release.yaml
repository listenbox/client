name: Native builds and stable releases
on:
  # Branch pushes belong to ci.yaml; native builds run on PRs and release tags.
  push:
    tags: [v*]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      current: ${{ steps.identity.outputs.current }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: '2026.11.7'
          install_args: node jq aube gh
      - name: Validate stable release identity
        id: identity
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: bash tools/release-validate.sh "$RELEASE_TAG"
  macos:
    needs: identity
    if: needs.identity.outputs.current == 'true'
    concurrency:
      group: desktop-macos-${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || github.ref }}
      cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/v') }}
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'desktop-release' || 'desktop-validation' }}
    runs-on: macos-15
    env:
      LISTENBOX_PRODUCTION_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
      LISTENBOX_SOURCE_COMMIT: ${{ github.sha }}
      LISTENBOX_UPDATE_PUBLIC_KEY: ${{ vars.MACOS_UPDATE_PUBLIC_KEY }}
      MACOS_UPDATE_PUBLIC_KEY: ${{ vars.MACOS_UPDATE_PUBLIC_KEY }}
      MACOS_UPDATE_SEED_BASE64: ${{ secrets.MACOS_UPDATE_SEED_BASE64 }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
      MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@v5
        with:
          version: '2026.11.7'
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
            .cache/ffmpeg
            .cache/native-src
          key: client-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock', 'go.sum', 'internal/nativebuild/**/*.go') }}
      - name: Import protected Apple signing credentials
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash tools/macos-signing.sh setup
      - name: Test native client and media on Apple Silicon
        run: moon exec --ignore-ci-checks client:test
      - name: Use TCP for Apple notarization ticket delivery
        if: startsWith(github.ref, 'refs/tags/v')
        # https://github.com/actions/runner-images/issues/14924
        run: |
          echo 'block return out quick proto udp from any to any port 443' | sudo pfctl -f -
          sudo pfctl -E
      - name: Build, sign and notarize Apple Silicon DMG with MyGo
        run: moon exec --ignore-ci-checks desktop:dmg
      - name: Verify Apple Silicon architecture and static codecs
        run: |
          binary=crates/desktop/dist/mygo/darwin-arm64/Listenbox.app/Contents/MacOS/Listenbox
          lipo "$binary" -verify_arch arm64
          dependencies="$(otool -L "$binary")"
          printf '%s\n' "$dependencies"
          if [[ "$dependencies" =~ lib(avcodec|avformat|avdevice|avfilter|avutil|swscale|swresample).*\.dylib ]]; then
            echo 'FFmpeg must be statically linked.' >&2
            exit 1
          fi
          "$binary" --version
      - name: Sign final update payload and generate macOS appcast
        if: startsWith(github.ref, 'refs/tags/v')
        run: node tools/release.mjs prepare macos-arm64 crates/desktop/dist/macos/Listenbox-${{ needs.identity.outputs.version }}-macos-arm64.dmg .cache/release-macos
      - name: Remove Apple credentials and ephemeral keychain
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: bash tools/macos-signing.sh cleanup
      - name: Upload macOS diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-macos-${{ github.run_attempt }}
          path: |
            .cache/native-src/FFmpeg-*/ffbuild/config.log
            crates/desktop/dist/mygo/**/*.notary.json
            .moon/cache/*Report.json
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: native-macos
          path: crates/desktop/dist/macos/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-macos
          path: .cache/release-macos/*
          if-no-files-found: error
  windows:
    needs: identity
    if: needs.identity.outputs.current == 'true'
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'desktop-release' || 'desktop-validation' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
            msystem: CLANG64
            sdk: clang-x86_64
            assembler: mingw-w64-clang-x86_64-nasm
          - architecture: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            sdk: clang-aarch64
            assembler: ''
    concurrency:
      group: desktop-windows-${{ matrix.architecture }}-${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || github.ref }}
      cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.runner }}
    env:
      LISTENBOX_PRODUCTION_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
      LISTENBOX_SOURCE_COMMIT: ${{ github.sha }}
      LISTENBOX_UPDATE_PUBLIC_KEY: ${{ vars.WINDOWS_UPDATE_PUBLIC_KEY }}
      WINDOWS_UPDATE_PUBLIC_KEY: ${{ vars.WINDOWS_UPDATE_PUBLIC_KEY }}
      WINDOWS_UPDATE_SEED_BASE64: ${{ secrets.WINDOWS_UPDATE_SEED_BASE64 }}
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          install: >-
            make diffutils tar xz openssl
            mingw-w64-${{ matrix.sdk }}-toolchain
            mingw-w64-${{ matrix.sdk }}-pkgconf
            ${{ matrix.assembler }}
      - name: Record native SDK identity
        id: sdk
        shell: msys2 {0}
        run: |
          sdk_hash="$(pacman -Q | sha256sum | cut -d ' ' -f 1)"
          printf 'identity=%s\n' "$sdk_hash" >> "$GITHUB_OUTPUT"
          printf 'MSYS2_LOCATION=%s\n' "${{ steps.msys2.outputs.msys2-location }}" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@v5
        with:
          version: '2026.11.7'
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/AppData/Local/go-build
            .cache/ffmpeg
            .cache/native-src
          key: client-native-windows-${{ matrix.architecture }}-${{ steps.sdk.outputs.identity }}-${{ hashFiles('mise.lock', 'go.sum', 'internal/nativebuild/**/*.go') }}
      - name: Build and verify MyGo release payload
        run: |
          New-Item -ItemType Directory -Force .cache | Out-Null
          moon exec --ignore-ci-checks desktop:build-release-windows-${{ matrix.architecture }} 2>&1 | Tee-Object .cache/windows-desktop-${{ matrix.architecture }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install verified Inno Setup compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download is-6_7_3 --repo jrsoftware/issrc --pattern innosetup-6.7.3.exe --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup download failed.' }
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Inno Setup checksum mismatch.' }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B.V.') { throw 'Invalid Inno Setup publisher.' }
          $process = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Build existing per-user upgrade installer
        run: ./tools/package-windows.ps1 -Architecture ${{ matrix.architecture }} -Payload crates/desktop/dist/windows-${{ matrix.architecture }}
      - uses: actions/upload-artifact@v7
        with:
          name: native-windows-${{ matrix.architecture }}
          path: crates/desktop/dist/installers/Listenbox-${{ needs.identity.outputs.version }}-windows-${{ matrix.architecture }}-setup.exe
          if-no-files-found: error
      - name: Sign final installer for WinSparkle and generate appcast
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $installer = 'crates/desktop/dist/installers/Listenbox-${{ needs.identity.outputs.version }}-windows-${{ matrix.architecture }}-setup.exe'
          node tools/release.mjs prepare windows-${{ matrix.architecture }} $installer .cache/release-windows-${{ matrix.architecture }}
          if ($LASTEXITCODE -ne 0) { throw 'Update signature/appcast generation failed.' }
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-windows-${{ matrix.architecture }}
          path: .cache/release-windows-${{ matrix.architecture }}/*
          if-no-files-found: error
      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-windows-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: |
            .cache/windows-*.log
            .cache/native-src/FFmpeg-*/ffbuild/config.log
            .moon/cache/*Report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [identity, macos, windows]
    concurrency:
      group: desktop-stable-publish
      cancel-in-progress: false
    environment: desktop-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MACOS_UPDATE_PUBLIC_KEY: ${{ vars.MACOS_UPDATE_PUBLIC_KEY }}
      WINDOWS_UPDATE_PUBLIC_KEY: ${{ vars.WINDOWS_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: '2026.11.7'
          install_args: node jq aube gh aqua:moonrepo/moon
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Verify immutable assets and promote complete stable release
        run: moon exec --ignore-ci-checks client:release-publish
