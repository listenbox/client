name: Native builds
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      KACHE_CONFIG: ${{ github.workspace }}/.kache.toml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pkgxdev/setup@v5
      - uses: moonrepo/setup-toolchain@v0
        with:
          moon-version: '2.5.5'
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache Cargo sources, kache, and Moon outputs
        uses: actions/cache@v6
        with:
          # Save each commit's progress, then restore the closest compatible build.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/kache
            .moon/cache/outputs
            ~/.pkgx
          key: rust-kache-v1-0.27.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.kache.toml', '.cargo/config.toml', 'rust-toolchain.toml', 'tools/native-ffmpeg.rs') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '**/moon.yml', '.moon/**/*.yml', '.github/workflows/ci.yaml', '.github/workflows/release.yaml') }}-${{ github.sha }}
          restore-keys: |
            rust-kache-v1-0.27.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.kache.toml', '.cargo/config.toml', 'rust-toolchain.toml', 'tools/native-ffmpeg.rs') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '**/moon.yml', '.moon/**/*.yml', '.github/workflows/ci.yaml', '.github/workflows/release.yaml') }}-
            rust-kache-v1-0.27.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.kache.toml', '.cargo/config.toml', 'rust-toolchain.toml', 'tools/native-ffmpeg.rs') }}-
      - name: Set up kache
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: '0.27.0'
          cache-dir: ${{ runner.temp }}/kache
          # The cache above refreshes on every commit, including source-only edits.
          github-cache: false
          pr-comment: false
      - name: Test release-linked media on Apple Silicon
        run: moon exec --ignore-ci-checks client-engine:test-media
      - name: Build Apple Silicon DMG
        run: moon exec --ignore-ci-checks desktop:dmg
      - name: Verify Apple Silicon architecture and FFmpeg linkage
        run: |
          binary=crates/desktop/dist/release/listenbox-desktop
          lipo "$binary" -verify_arch arm64
          dependencies="$(otool -L "$binary")"
          printf '%s\n' "$dependencies"
          if [[ "$dependencies" =~ lib(avcodec|avformat|avutil|swresample).*\.dylib ]]; then
            echo 'FFmpeg must be statically linked.' >&2
            exit 1
          fi
      - name: Upload macOS diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-macos-${{ github.run_attempt }}
          path: |
            target/nextest/ci/junit.xml
            target/release/build/ffmpeg-sys-the-third-*/output
            .cache/ffmpeg-*/ffbuild/config.log
            .moon/cache/*Report.json
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: crates/desktop/dist/macos/*.dmg
          if-no-files-found: error

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            target: x86_64-pc-windows-msvc
            runner: windows-2025
            llvm-platform: win64
            llvm-sha256: 16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c
          - architecture: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            llvm-platform: woa64
            llvm-sha256: 76f44ef1ba6eeb5a65904e9500f042f588fade49952778ce48f0374daa934396
    runs-on: ${{ matrix.runner }}
    env:
      KACHE_CONFIG: ${{ github.workspace }}/.kache.toml
      LLVM_VERSION: '22.1.8'
    defaults:
      run:
        shell: pwsh
    outputs:
      release-version: ${{ steps.version.outputs.version }}
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install host-native LLVM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLVM_PLATFORM: ${{ matrix.llvm-platform }}
          LLVM_SHA256: ${{ matrix.llvm-sha256 }}
        run: |
          # LLVM 20/21 can crash when ffmpeg-sys unloads libclang after probing.
          # LLVM 22 includes https://github.com/llvm/llvm-project/pull/171465.
          $archive = "LLVM-$env:LLVM_VERSION-$env:LLVM_PLATFORM.exe"
          $download = Join-Path $env:RUNNER_TEMP $archive
          $directory = Join-Path $env:RUNNER_TEMP 'llvm'
          $libclangPath = Join-Path $directory 'bin'
          gh release download "llvmorg-$env:LLVM_VERSION" --repo llvm/llvm-project --pattern $archive --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'LLVM download failed.' }
          if ((Get-FileHash $download -Algorithm SHA256).Hash -ne $env:LLVM_SHA256) { throw 'LLVM checksum mismatch.' }
          7z x $download "-o$directory" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'LLVM extraction failed.' }
          Remove-Item $download
          if (-not (Test-Path (Join-Path $libclangPath 'libclang.dll'))) { throw 'LLVM libclang.dll is missing.' }
          & (Join-Path $libclangPath 'clang.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'LLVM cannot run on this host.' }
          "LIBCLANG_PATH=$libclangPath" >> $env:GITHUB_ENV
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MSYS
          path-type: inherit
          install: make diffutils tar xz openssl
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: Install Moon
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Moon publishes x64 Windows binaries; Windows ARM64 runs these too.
          $archive = 'moon_cli-x86_64-pc-windows-msvc.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'moon'
          New-Item -ItemType Directory -Force $tools | Out-Null
          gh release download v2.5.5 --repo moonrepo/moon --pattern $archive --pattern "$archive.sha256" --dir $tools
          if ($LASTEXITCODE -ne 0) { throw 'Moon download failed.' }
          $expected = ((Get-Content (Join-Path $tools "$archive.sha256") -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash (Join-Path $tools $archive) -Algorithm SHA256).Hash -ne $expected) { throw 'Moon checksum mismatch.' }
          Expand-Archive (Join-Path $tools $archive) $tools
          (Get-ChildItem $tools -Recurse -Filter moon.exe | Select-Object -First 1).DirectoryName >> $env:GITHUB_PATH
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt --target ${{ matrix.target }}
      - name: Resolve desktop release version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed.' }
          $desktop = @($metadata.packages | Where-Object { $_.name -eq 'listenbox-desktop' })
          if ($desktop.Count -ne 1) { throw 'Expected exactly one listenbox-desktop package.' }
          $version = "$($desktop[0].version)+$($env:GITHUB_SHA.Substring(0, 12))"
          "version=$version" >> $env:GITHUB_OUTPUT
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $component = if ('${{ matrix.architecture }}' -eq 'arm64') { 'ARM64' } else { 'x86.x64' }
          $vsVersion = & $vswhere -latest -products '*' -requires "Microsoft.VisualStudio.Component.VC.Tools.$component" -property installationVersion
          if ($LASTEXITCODE -ne 0 -or -not $vsVersion) { throw 'Visual Studio build tools are missing.' }
          "native-toolchain=$vsVersion" >> $env:GITHUB_OUTPUT
      - name: Cache Cargo sources and kache
        uses: actions/cache@v6
        with:
          # Keep MSVC/LLVM compatibility fixed while refreshing Cargo per commit.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/kache
          key: windows-rust-kache-v1-0.27.0-${{ matrix.target }}-${{ steps.version.outputs.native-toolchain }}-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('.kache.toml', 'rust-toolchain.toml', '.cargo/config.toml', 'tools/native-ffmpeg.rs', 'tools/build-windows.ps1') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            windows-rust-kache-v1-0.27.0-${{ matrix.target }}-${{ steps.version.outputs.native-toolchain }}-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('.kache.toml', 'rust-toolchain.toml', '.cargo/config.toml', 'tools/native-ffmpeg.rs', 'tools/build-windows.ps1') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-
            windows-rust-kache-v1-0.27.0-${{ matrix.target }}-${{ steps.version.outputs.native-toolchain }}-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('.kache.toml', 'rust-toolchain.toml', '.cargo/config.toml', 'tools/native-ffmpeg.rs', 'tools/build-windows.ps1') }}-
      - name: Set up kache
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: '0.27.0'
          cache-dir: ${{ runner.temp }}/kache
          # The cache above refreshes on every commit, including source-only edits.
          github-cache: false
          pr-comment: false
      - name: Restore FFmpeg
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/ffmpeg-${{ matrix.target }}
          key: windows-ffmpeg-${{ matrix.target }}-${{ steps.version.outputs.native-toolchain }}-${{ hashFiles('rust-toolchain.toml', 'tools/native-ffmpeg.rs', 'tools/build-windows.ps1') }}
      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          New-Item -ItemType Directory -Force .cache | Out-Null
          moon exec --ignore-ci-checks client:native-ffmpeg-windows-${{ matrix.architecture }} 2>&1 | Tee-Object .cache/windows-ffmpeg-${{ matrix.architecture }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Save the native build before Cargo runs, even if compilation later fails.
      - name: Save FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/ffmpeg-${{ matrix.target }}
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
      - name: Build and verify release
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        # Generated sources are checked in here. FFmpeg was prepared above and
        # must not be rebuilt after an exact cache hit.
        run: |
          New-Item -ItemType Directory -Force .cache | Out-Null
          moon exec --ignore-ci-checks --upstream none desktop:build-release-windows-${{ matrix.architecture }} 2>&1 | Tee-Object .cache/windows-desktop-${{ matrix.architecture }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-windows-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: |
            .cache/windows-*.log
            target/nextest/ci/junit.xml
            target/${{ matrix.target }}/release/build/ffmpeg-sys-the-third-*/output
            .cache/ffmpeg-build-${{ matrix.target }}/ffmpeg-*/ffbuild/config.log
            .moon/cache/*Report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.architecture }}
          path: |
            crates/desktop/dist/listenbox-desktop-windows-${{ matrix.architecture }}.exe
            crates/desktop/dist/listenbox-desktop-windows-${{ matrix.architecture }}.zip
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RELEASE_VERSION: ${{ needs.windows.outputs.release-version }}
        run: |
          set -euo pipefail
          test -n "$DESKTOP_RELEASE_VERSION"
          macos_version="${DESKTOP_RELEASE_VERSION%%+*}"
          test -f "artifacts/Listenbox-${macos_version}-macos-arm64.dmg"
          test -f artifacts/listenbox-desktop-windows-x64.exe
          test -f artifacts/listenbox-desktop-windows-x64.zip
          test -f artifacts/listenbox-desktop-windows-arm64.exe
          test -f artifacts/listenbox-desktop-windows-arm64.zip
          tag="desktop-v${DESKTOP_RELEASE_VERSION}"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Desktop builds from master:

          - **macOS Apple Silicon**: open the DMG and drag Listenbox to Applications. The app is ad-hoc signed and is not notarized.
          - **Windows x64**: Intel and AMD PCs; also runs through emulation on Windows 11 ARM.
          - **Windows ARM64**: native build for Snapdragon/ARM Windows PCs.

          Windows ZIPs include the executable and third-party license notices. The matching EXEs can be run directly. Windows executables are unsigned. Interactive testing is still required.
          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber artifacts/*
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "Listenbox Desktop ${DESKTOP_RELEASE_VERSION}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" artifacts/*
          fi
