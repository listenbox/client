# Native build matrix adapted from egoist/mygo-music's release workflow.
# Codec libraries require a native SDK for each target architecture.
name: Native builds and stable releases
on:
  push:
    tags: [v*]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      current: ${{ steps.identity.outputs.current }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: '2026.11.7'
          install_args: node jq aube gh
      - name: Validate stable release identity
        id: identity
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: bash tools/release-validate.sh "$RELEASE_TAG"
  native:
    needs: identity
    if: needs.identity.outputs.current == 'true'
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'desktop-release' || 'desktop-validation' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            os: macos-15
            platform: darwin/arm64
            build-target: desktop:dmg
            architecture: arm64
            update-key: MACOS_UPDATE_PUBLIC_KEY
            artifact-directory: macos
            installer-suffix: .dmg
          - id: windows-x64
            os: windows-2025
            platform: windows/amd64
            build-target: desktop:build-release-windows-x64
            architecture: x64
            update-key: WINDOWS_UPDATE_PUBLIC_KEY
            msystem: CLANG64
            sdk: clang-x86_64
            assembler: mingw-w64-clang-x86_64-nasm
            artifact-directory: installers
            installer-suffix: -setup.exe
          - id: windows-arm64
            os: windows-11-arm
            platform: windows/arm64
            build-target: desktop:build-release-windows-arm64
            architecture: arm64
            update-key: WINDOWS_UPDATE_PUBLIC_KEY
            msystem: CLANGARM64
            sdk: clang-aarch64
            assembler: ''
            artifact-directory: installers
            installer-suffix: -setup.exe
    concurrency:
      group: desktop-${{ matrix.id }}-${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || github.ref }}
      cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/v') }}
    env:
      LISTENBOX_PRODUCTION_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
      LISTENBOX_SOURCE_COMMIT: ${{ github.sha }}
      LISTENBOX_UPDATE_PUBLIC_KEY: ${{ vars[matrix.update-key] }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - name: Preserve Unix line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        id: msys2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          install: >-
            make diffutils tar xz openssl
            mingw-w64-${{ matrix.sdk }}-toolchain
            mingw-w64-${{ matrix.sdk }}-pkgconf
            ${{ matrix.assembler }}
      - name: Record native SDK identity
        if: runner.os == 'Windows'
        id: sdk
        shell: msys2 {0}
        run: |
          sdk_hash="$(pacman -Q | sha256sum | cut -d ' ' -f 1)"
          printf 'identity=%s\n' "$sdk_hash" >> "$GITHUB_OUTPUT"
          printf 'MSYS2_LOCATION=%s\n' "${{ steps.msys2.outputs.msys2-location }}" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@v5
        with:
          version: '2026.11.7'
      # As in mygo-music, ask Go for its paths rather than guessing per OS.
      - name: Find Go caches
        id: go-env
        run: |
          echo "build=$(mise exec -- go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(mise exec -- go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.mod }}
            .cache/ffmpeg
            .cache/native-src
          key: client-native-${{ matrix.id }}-${{ steps.sdk.outputs.identity }}-${{ hashFiles('mise.lock', 'go.sum', 'internal/nativebuild/**/*.go') }}
          restore-keys: client-native-${{ matrix.id }}-${{ steps.sdk.outputs.identity }}-
      - name: Import protected Apple signing credentials
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: bash tools/macos-signing.sh setup
      - name: Test native client and media
        run: moon exec --ignore-ci-checks client:test
      - name: Use TCP for Apple notarization ticket delivery
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        # https://github.com/actions/runner-images/issues/14924
        run: |
          echo 'block return out quick proto udp from any to any port 443' | sudo pfctl -f -
          sudo pfctl -E
      - name: Build and verify MyGo release payload
        run: moon exec --ignore-ci-checks '${{ matrix.build-target }}' 2>&1 | tee '.cache/desktop-${{ matrix.id }}.log'
      # Preserve the Inno AppId/mutex used by installed WinSparkle clients.
      - name: Install verified Inno Setup compiler
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download is-6_7_3 --repo jrsoftware/issrc --pattern innosetup-6.7.3.exe --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup download failed.' }
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Inno Setup checksum mismatch.' }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B.V.') { throw 'Invalid Inno Setup publisher.' }
          $process = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Build existing per-user upgrade installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/package-windows.ps1 -Architecture ${{ matrix.architecture }} -Payload crates/desktop/dist/${{ matrix.id }}
      - name: Sign final payload and generate the existing update appcast
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_UPDATE_PUBLIC_KEY: ${{ vars.MACOS_UPDATE_PUBLIC_KEY }}
          WINDOWS_UPDATE_PUBLIC_KEY: ${{ vars.WINDOWS_UPDATE_PUBLIC_KEY }}
          MACOS_UPDATE_SEED_BASE64: ${{ matrix.id == 'macos-arm64' && secrets.MACOS_UPDATE_SEED_BASE64 || '' }}
          WINDOWS_UPDATE_SEED_BASE64: ${{ runner.os == 'Windows' && secrets.WINDOWS_UPDATE_SEED_BASE64 || '' }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          RELEASE_PLATFORM: ${{ matrix.id }}
          RELEASE_DIRECTORY: ${{ matrix.artifact-directory }}
          RELEASE_SUFFIX: ${{ matrix.installer-suffix }}
        run: |
          payload="crates/desktop/dist/$RELEASE_DIRECTORY/Listenbox-$RELEASE_VERSION-$RELEASE_PLATFORM$RELEASE_SUFFIX"
          mise exec -- node tools/release.mjs prepare "$RELEASE_PLATFORM" "$payload" ".cache/release-$RELEASE_PLATFORM"
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.id }}
          path: crates/desktop/dist/${{ matrix.artifact-directory }}/Listenbox-${{ needs.identity.outputs.version }}-${{ matrix.id }}${{ matrix.installer-suffix }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-${{ matrix.id }}
          path: .cache/release-${{ matrix.id }}/*
          if-no-files-found: error
      - name: Remove Apple credentials and ephemeral keychain
        if: always() && runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        run: bash tools/macos-signing.sh cleanup
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.id }}-${{ github.run_attempt }}
          path: |
            .cache/desktop-*.log
            .cache/native-src/FFmpeg-*/ffbuild/config.log
            .moon/cache/*Report.json
            crates/desktop/dist/mygo/**/*.notary.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [identity, native]
    concurrency:
      group: desktop-stable-publish
      cancel-in-progress: false
    environment: desktop-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MACOS_UPDATE_PUBLIC_KEY: ${{ vars.MACOS_UPDATE_PUBLIC_KEY }}
      WINDOWS_UPDATE_PUBLIC_KEY: ${{ vars.WINDOWS_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: '2026.11.7'
          install_args: node jq aube gh aqua:moonrepo/moon
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Verify immutable assets and promote complete stable release
        run: moon exec --ignore-ci-checks client:release-publish
