name: Release Windows desktop
on:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            target: x86_64-pc-windows-msvc
            runner: windows-2025
          - architecture: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MSYS
          path-type: inherit
          install: make diffutils tar xz openssl
      - name: Install Moon
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Moon publishes x64 Windows binaries; Windows ARM64 runs these too.
          $archive = 'moon_cli-x86_64-pc-windows-msvc.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'moon'
          New-Item -ItemType Directory -Force $tools | Out-Null
          gh release download v2.5.5 --repo moonrepo/moon --pattern $archive --pattern "$archive.sha256" --dir $tools
          if ($LASTEXITCODE -ne 0) { throw 'Moon download failed.' }
          $expected = ((Get-Content (Join-Path $tools "$archive.sha256") -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash (Join-Path $tools $archive) -Algorithm SHA256).Hash -ne $expected) { throw 'Moon checksum mismatch.' }
          Expand-Archive (Join-Path $tools $archive) $tools
          (Get-ChildItem $tools -Recurse -Filter moon.exe | Select-Object -First 1).DirectoryName >> $env:GITHUB_PATH
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt --target ${{ matrix.target }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .cache/ffmpeg-${{ matrix.target }}
          key: windows-${{ matrix.architecture }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/native-ffmpeg.rs', 'tools/build-windows.ps1') }}
      - name: Build and verify release
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: moon run desktop:build-release-windows-${{ matrix.architecture }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.architecture }}
          path: |
            crates/desktop/dist/listenbox-desktop-windows-${{ matrix.architecture }}.exe
            crates/desktop/dist/listenbox-desktop-windows-${{ matrix.architecture }}.zip
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-*
          merge-multiple: true
          path: artifacts
      - name: Publish Windows test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="windows-${GITHUB_SHA:0:12}"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Windows desktop builds from master:

          - **x64**: Intel and AMD Windows PCs. Also runs through emulation on Windows 11 ARM.
          - **ARM64**: native build for Snapdragon/ARM Windows PCs and Windows 11 ARM in VMware Fusion on Apple Silicon.

          Choose the ZIP for your architecture for the executable and third-party license notices, or the EXE to run directly. The executables are unsigned. Each build verifies its architecture, runtime DLL dependencies, and command-line startup; interactive testing is still required.
          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber artifacts/*
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "Windows x64 + ARM64 (${GITHUB_SHA:0:12})" \
              --notes-file "$RUNNER_TEMP/release-notes.md" artifacts/*
          fi
