name: Cache Cargo downloads
description: Restore and save dependency downloads independently of build artifacts.
inputs:
  target:
    description: Rust target triple to fetch dependencies for.
    required: true
runs:
  using: composite
  steps:
    - name: Restore Cargo downloads
      id: downloads
      uses: actions/cache/restore@v6
      with:
        # Keep compressed crates and indexes, not duplicate unpacked sources.
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-downloads-v1-${{ runner.os }}-${{ inputs.target }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-downloads-v1-${{ runner.os }}-${{ inputs.target }}-
    - name: Fetch locked dependencies
      shell: bash
      env:
        CARGO_FETCH_TARGET: ${{ inputs.target }}
      run: cargo fetch --locked --target "$CARGO_FETCH_TARGET"
    # Save before compilation so later build/test failures keep the downloads.
    # A failed or cancelled fetch must not create an incomplete exact-hit cache.
    - name: Save Cargo downloads
      if: steps.downloads.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ steps.downloads.outputs.cache-primary-key }}
