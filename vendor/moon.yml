language: typescript
layer: library
taskOptions:
  cache: true
fileGroups:
  sources:
    - youtubejs/src/**/*
    - youtubejs/protos/generated/**/*
    - youtubejs/package.json
    - youtubejs/tsconfig.json
    - aube-workspace.yaml
    - aube-lock.yaml
    - package.json
    - moon.yml
tasks:
  install:
    command: aube install --frozen-lockfile --ignore-scripts
    inputs: [package.json, youtubejs/package.json, aube-workspace.yaml, aube-lock.yaml]
    options:
      cache: false
      internal: true
      outputStyle: buffer-only-failure
  bundle:
    deps: [~:install]
    command: bash bundle.sh
    inputs: ['@group(sources)', bundle.sh]
    outputs: [bundle/cf-worker.js]
  test:
    deps: [~:bundle]
    command: aube exec --no-install vitest run --globals --testTimeout 30000 tests/youtubejs.test.js
    inputs: ['@group(sources)', tests/youtubejs.test.js]
