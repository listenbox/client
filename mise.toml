# Keep this submodule independently buildable. These pins agree with the parent
# workspace; the native build environment stays local to this config root.
[tools]
go = "1.27.4"
shellcheck = "0.11.0"
aube = "2.5.1"
node = "26.5.0"
bun = "1.4.4"
"aqua:moonrepo/moon" = "2.5.6"
jq = "1.8.1"
gh = "2.104.0"
# Linux compiler toolchain. macOS uses the selected Xcode SDK's compilers.
# Windows uses the native CLANG64/CLANGARM64 MSYS2 SDK
# checked by client:native-setup; its compiler must target the same CRT as FFmpeg.
cmake = "4.5.0"
ninja = "1.13.2"
clang = { version = "23.1.5", os = ["linux"] }
"conda:clangxx" = { version = "23.1.5", os = ["linux"] }
make = { version = "4.4.1", os = ["linux", "macos"] }
"conda:pkg-config" = { version = "0.29.2", os = ["linux", "macos"] }
"conda:nasm" = { version = "2.16.03", os = ["linux", "macos"] }
"conda:openssl" = { version = "4.1.0", os = ["linux", "macos"] }
"conda:curl" = { version = "8.23.0", os = ["linux", "macos"] }

# Apple's HLS validation CLIs: mediastreamvalidator and msvsummary, plus
# hlsreport on macOS. Apple serves the archives only behind a developer sign-in,
# so tools/ keeps Apple's originals and mise.lock pins their checksums. Apple
# builds Linux tools for x64 only; the postinstall unpacks them without root.
[tools."http:apple-hls-tools"]
version = "2.0.284"
os = ["linux/x64", "macos"]
bin_path = "bin"
postinstall = "bash '{{ config_root }}/tools/install-apple-hls-tools.sh'"

[tools."http:apple-hls-tools".platforms]
# Apple names this plain tar .tgz.
linux-x64 = { url = "file://{{ config_root }}/tools/hlstools_validation_ubuntu_release_{{ version }}.tgz", format = "tar" }
macos-arm64 = { url = "file://{{ config_root }}/tools/HTTPLiveStreamingTools_{{ version }}_Validation.dmg" }
macos-x64 = { url = "file://{{ config_root }}/tools/HTTPLiveStreamingTools_{{ version }}_Validation.dmg" }

[env]
CGO_ENABLED = "1"
CC = "{% if os() == 'windows' %}\"{{ get_env(name='MSYS2_LOCATION', default='C:/msys64') }}/{% if arch() == 'arm64' %}clangarm64{% else %}clang64{% endif %}/bin/clang.exe\"{% elif os() == 'macos' %}/usr/bin/clang{% else %}clang{% endif %}"
CXX = "{% if os() == 'windows' %}\"{{ get_env(name='MSYS2_LOCATION', default='C:/msys64') }}/{% if arch() == 'arm64' %}clangarm64{% else %}clang64{% endif %}/bin/clang++.exe\"{% elif os() == 'macos' %}/usr/bin/clang++{% else %}clang++{% endif %}"
PKG_CONFIG = "{% if os() == 'windows' %}{{ get_env(name='MSYS2_LOCATION', default='C:/msys64') }}/{% if arch() == 'arm64' %}clangarm64{% else %}clang64{% endif %}/bin/pkg-config.exe{% else %}pkg-config{% endif %}"
PKG_CONFIG_PATH = "{{config_root}}/.cache/ffmpeg/lib/pkgconfig"
# Tailscale SQLite's monotonic clock uses MinGW's winpthreads implementation.
# Link it statically for both tests and the distributed application.
# CGO packages repeat shared native dependencies; Apple's linker already ignores
# those repeats. Disable its duplicate-library diagnostic for CLI and desktop.
CGO_LDFLAGS = "{% if os() == 'windows' %}-static -lwinpthread{% elif os() == 'macos' %}-Wl,-no_warn_duplicate_libraries{% endif %}"
