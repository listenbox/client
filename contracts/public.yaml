  /s/image-uploads/presign:
    post:
      description: Allocate artwork in a show-owned image namespace. Fresh shows
        require show:create for the API key team. Existing shows require
        show:update and write access, and use the show's owning team.
      operationId: createImageUploadPresign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImageUploadPresign"
      security:
        - ApiKeyAuth: []
