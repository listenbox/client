        "401":
          description: Missing or invalid token.
        "402":
          description: An audio plan is required to upload files.
        "403":
          description: Missing show:create or show:update permission.
        "404":
          description: Writable show not found.
        "409":
          description: Show ID is already in use.
  /s/image-uploads/{image_asset_id}/complete:
