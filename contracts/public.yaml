  /s/episode-packages:
    post:
      description: Admit client-processed media, reserve video capacity, and presign
        initial storage uploads. An audio package up to 5 GiB uses this
        admission, one direct media-bucket PUT, and completion. The server owns
        storage-session finalization and publishes only the verified package.
      operationId: createEpisodePackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEpisodePackage"
      security:
        - ApiKeyAuth: []
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodePackage"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "402":
          description: "402"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoAdmissionError"
        "404":
          description: Writable video show not found.
        "409":
          description: Source already has a different package.
        "423":
          $ref: "#/components/responses/YouTubeSyncStoppedResponse"
  /s/episode-packages/{upload_session_id}:
    parameters:
      - name: upload_session_id
