openapi: 3.2.0
info:
  title: Listenbox Public API
  version: "1"
paths:
  /:
    get:
      operationId: openapi
      responses:
        "200":
          description: Generated OpenAPI document.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Vary:
              $ref: "#/components/headers/Vary"
          content:
            text/yaml:
              schema:
                $ref: "#/components/schemas/OpenAPIYAMLDocument"
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAPIJSONDocument"
        "304":
          description: Selected OpenAPI representation has not changed.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Vary:
              $ref: "#/components/headers/Vary"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
    head:
      operationId: headOpenapi
      responses:
        "200":
          description: Generated OpenAPI document.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Vary:
              $ref: "#/components/headers/Vary"
        "304":
          description: Selected OpenAPI representation has not changed.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Vary:
              $ref: "#/components/headers/Vary"
        "400":
          description: "400"
  /cli/authorizations:
    post:
      description: Creates a fresh authorization attempt for Listenbox CLI or Desktop.
        The client is required and retained for browser consent. Subscribe to
        its events separately.
      operationId: createCLIAuthorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCLIAuthorization"
      security:
        - ApiKeyAuth: []
        - {}
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedCLIAuthorization"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: An optional previous API key was invalid; retry anonymously.
  /cli/authorizations/{code}/events:
    get:
      operationId: cliAuthorizationEvents
      parameters:
        - name: code
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CLIAuthorizationCode"
      security:
        - ApiKeyAuth: []
        - {}
      responses:
        "200":
          description: CLI authorization pending and terminal events.
          content:
            text/event-stream:
              itemSchema:
                $ref: "#/components/schemas/CLIAuthorizationEvent"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "404":
          description: Authorization attempt not found.
  /s/whoami:
    get:
      operationId: whoami
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyWhoami"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
  /s/team/members:
    get:
      operationId: listTeamMembers
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberCollection"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:read or its creator is no longer a member.
  /s/team/invitations:
    post:
      operationId: createTeamInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamInvitation"
      security:
        - ApiKeyAuth: []
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingTeamInvitation"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:manage or its creator is not an owner.
        "409":
          description: Email is already a member or has a pending invite.
  /s/team/invitations/{invitation_id}:
    parameters:
      - name: invitation_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/TeamInvitationID"
    put:
      operationId: updateTeamInvitationRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamMemberRole"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingTeamInvitation"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:manage or its creator is not an owner.
        "404":
          description: Pending invitation not found.
    delete:
      operationId: revokeTeamInvitation
      security:
        - ApiKeyAuth: []
      responses:
        "204":
          description: Invitation revoked.
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:manage or its creator is not an owner.
        "404":
          description: Pending invitation not found.
  /s/team/members/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UserID"
    put:
      operationId: updateTeamMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamMemberRole"
      security:
        - ApiKeyAuth: []
      responses:
        "204":
          description: Member role changed.
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:manage or its creator is not an owner.
        "404":
          description: Mutable team member not found.
    delete:
      operationId: removeTeamMember
      security:
        - ApiKeyAuth: []
      responses:
        "204":
          description: Member removed.
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:manage or its creator is not an owner.
        "404":
          description: Removable team member not found.
  /s/import-capacity:
    get:
      description: Read the destination team's paid-plan status and video capacity
        before creating a YouTube podcast. Clients sum known durations from the
        full playlist listing regardless of playability, without per-video
        playback requests. Missing durations are omitted from the estimate.
        Requires show:create and current write access to the destination team.
      operationId: getImportCapacity
      parameters:
        - name: team_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TeamID"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCapacity"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: Missing show:create scope or team write access.
        "404":
          description: Team membership not found.
  /s/teams:
    get:
      description: Teams the signed-in user belongs to or can access through a shared show.
      operationId: listClientTeams
      parameters:
        - name: writable_only
          in: query
          schema:
            type: boolean
            description: Only teams where the user can create podcasts. Direct show
              collaboration does not grant team write access.
        - name: include_plan_family
          in: query
          schema:
            type: boolean
            description: Include each team's plan family. Omitted by default for
              compatibility with existing clients.
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientTeam"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: Missing team:read scope.
  /s/shows:
    get:
      description: Lists all shows accessible to the API key creator, including team
        membership and direct show collaboration.
      operationId: listShows
      parameters:
        - name: youtube_imports_only
          in: query
          schema:
            type: boolean
            description: Return only shows the server currently allows to import from
              YouTube. Used by the desktop catalog.
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Show"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
    post:
      description: Creates a show in the requested team, where the API key creator
        must have current write access. A YouTube URL already linked to a
        podcast in that team returns 409 with code show_already_imported and the
        existing show identity. Other teams can import the same URL
        independently. Unavailable slugs for new shows return 409. An optional
        YouTube linkage is shared with the show’s publishing destination.
      operationId: createShow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShow"
      security:
        - ApiKeyAuth: []
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Show"
        "400":
          description: Invalid show or YouTube source URL.
        "401":
          description: Missing or invalid token.
        "402":
          description: A paid podcast plan is required for YouTube imports.
        "403":
          description: Missing show:create scope or team write access.
        "404":
          description: Destination team membership not found.
        "409":
          description: show_already_imported identifies the existing podcast for this
            team's canonical YouTube URL using show_id, show_slug and team_id.
            show_identity_conflict means the requested show ID exists or the
            globally unique slug is taken or reserved. No podcast was created or
            changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastCreationConflict"
        "422":
          description: YouTube channel URL does not return valid public channel metadata.
            No show was created.
        "502":
          description: YouTube channel page could not be read. No show was created.
  /s/shows/{show_slug}:
    put:
      description: Atomically update the supplied shared podcast fields. Requires
        show:update and current write access. Artwork must be a completed image
        upload owned by this show and team. Feed-specific overrides and omitted
        metadata are preserved. Replaying a request is safe.
      operationId: updateShow
      parameters:
        - name: show_slug
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ShowSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShow"
      security:
        - ApiKeyAuth: []
      responses:
        "204":
          description: Show updated.
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: Missing show:update scope or write access.
        "404":
          description: Show not found.
        "409":
          description: Show slug is in use or awaiting cleanup, the show changed, or
            completed artwork is unavailable.
  /s/shows/{show_slug}/sync:
    get:
      description: Compact URL-keyed inventory for client reconciliation. Read every
        page before making changes. The show owns its immutable source; manually
        uploaded episodes are not synchronization-owned. Requires a paid audio
        or video plan.
      operationId: getSyncInventory
      parameters:
        - name: show_slug
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ShowSlug"
        - name: cursor
          in: query
          schema:
            $ref: "#/components/schemas/EpisodeID"
        - name: limit
          in: query
          schema:
            $ref: "#/components/schemas/EpisodePageLimit"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncInventory"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "402":
          description: A paid podcast plan is required.
        "403":
          description: Missing show:read scope.
        "404":
          description: Show not found.
        "423":
          $ref: "#/components/responses/YouTubeSyncStoppedResponse"
  /s/shows/{show_slug}/sync/metadata:
    put:
      description: Atomically update imported episode titles and fill missing podcast
        artwork through a completed image asset. Existing primary-feed artwork,
        show artwork and source thumbnails are preserved, including artwork
        saved after the client scan. Requires show:update and write access;
        title changes also require episode:update. Rechecks the current YouTube
        linkage and paid plan under the show lock. Replaying a committed request
        is safe; media, publication dates and episode artwork are unchanged.
      operationId: updateSyncMetadata
      parameters:
        - name: show_slug
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ShowSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSyncMetadata"
      security:
        - ApiKeyAuth: []
      responses:
        "204":
          description: Source metadata synchronized.
        "400":
          description: Invalid source metadata.
        "401":
          description: Missing or invalid token.
        "402":
          description: A paid podcast plan is required.
        "403":
          description: Missing show:update or episode:update permission.
        "404":
          description: Writable show not found.
        "409":
          description: The linkage changed, an episode is not import-owned, or the image
            asset is unavailable for this show.
        "413":
          description: Request body exceeds the gateway limit.
        "423":
          $ref: "#/components/responses/YouTubeSyncStoppedResponse"
  /s/shows/{show_slug}/sync/episodes/{episode_id}/deletion:
    post:
      description: Remove an imported episode while this show imports from its
        canonical YouTube linkage. Uses the normal owner-only episode deletion
        lifecycle; observe deletion events for completion.
      operationId: createSyncEpisodeDeletion
      parameters:
        - name: show_slug
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ShowSlug"
        - name: episode_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/EpisodeID"
        - name: youtube_url
          in: query
          required: true
          schema:
            type: string
            maxLength: 2048
            format: uri
            pattern: ^https?://\S+$
      security:
        - ApiKeyAuth: []
      responses:
        "202":
          description: "202"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedPublicEpisodeDeletion"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "402":
          description: A paid podcast plan is required.
        "403":
          description: Missing episode:delete permission.
        "404":
          description: Show or source-owned episode not found.
        "409":
          description: The episode does not belong to this show’s import.
        "423":
          $ref: "#/components/responses/YouTubeSyncStoppedResponse"
  /s/shows/{show_slug}/episode-order:
    parameters:
      - name: show_slug
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ShowSlug"
    get:
      description: Read the current published episode sequence for all feeds of a
        show, including creator-uploaded episodes.
      operationId: getEpisodeOrder
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeOrder"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: Missing show:read permission.
        "404":
          description: Show not found.
    put:
      description: Atomically reorder published episodes for a creator-managed or
        synchronized show. Changes stored/feed order only; publication dates,
        GUIDs and media stay unchanged. Requires show:update and write access.
        Source-controlled shows also require an active subscription and the
        current collection guard.
      operationId: setEpisodeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEpisodeOrder"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeOrder"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "402":
          description: Source synchronization requires a paid podcast plan.
        "403":
          description: Missing show:update permission.
        "404":
          description: Show not found.
        "409":
          description: The source changed, or a requested episode is no longer published
            in this show.
        "423":
          $ref: "#/components/responses/YouTubeSyncStoppedResponse"
  /s/shows/{show_slug}/episodes:
    get:
      description: Lists every episode for an accessible show in source order when
        configured, otherwise by publication date, newest first, with undated
        drafts last. Continue with next_cursor; this is a live keyset scan.
      operationId: listEpisodes
      parameters:
        - name: show_slug
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ShowSlug"
        - name: limit
          in: query
          schema:
            $ref: "#/components/schemas/EpisodePageLimit"
        - name: cursor
          in: query
          schema:
            $ref: "#/components/schemas/EpisodePageCursor"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodePage"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing the show:read scope.
        "404":
          description: Show was not found for the API key team and user.
  /s/shows/{show_slug}/members:
    get:
      operationId: listShowMembers
      parameters:
        - name: show_slug
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ShowSlug"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowMemberCollection"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing show:read or its creator lacks effective show
            access.
        "404":
          description: Show not found.
  /s/shows/{show_slug}/invitations:
    post:
      operationId: createShowInvitation
      parameters:
        - name: show_slug
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ShowSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShowInvitation"
      security:
        - ApiKeyAuth: []
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingShowInvitation"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:manage or its creator is not a team owner.
        "404":
          description: Show not found.
        "409":
          description: Email already has effective access or a pending invitation.
  /s/shows/{show_slug}/invitations/{invitation_id}:
    parameters:
      - name: show_slug
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ShowSlug"
      - name: invitation_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ShowInvitationID"
    put:
      operationId: updateShowInvitationRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShowMemberRole"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingShowInvitation"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:manage or its creator is not a team owner.
        "404":
          description: Pending invitation not found.
    delete:
      operationId: revokeShowInvitation
      security:
        - ApiKeyAuth: []
      responses:
        "204":
          description: Invitation revoked.
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:manage or its creator is not a team owner.
        "404":
          description: Pending invitation not found.
  /s/shows/{show_slug}/members/{user_id}:
    parameters:
      - name: show_slug
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ShowSlug"
      - name: user_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UserID"
    put:
      operationId: updateShowMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShowMemberRole"
      security:
        - ApiKeyAuth: []
      responses:
        "204":
          description: Collaborator role changed.
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:manage or its creator is not a team owner.
        "404":
          description: Direct collaborator not found.
    delete:
      operationId: removeShowMember
      security:
        - ApiKeyAuth: []
      responses:
        "204":
          description: Collaborator removed.
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:manage or its creator is not a team owner.
        "404":
          description: Direct collaborator not found.
  /s/shows/{show_slug}/deletions:
    post:
      operationId: createShowDeletion
      parameters:
        - name: show_slug
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ShowSlug"
      security:
        - ApiKeyAuth: []
      responses:
        "202":
          description: "202"
          content:
            application/json:
              schema:
