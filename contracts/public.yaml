        "404":
          description: Uploaded image not found.
        "409":
          description: Image upload was already completed.
  /s/rss-imports:
    post:
      description: Imports an RSS feed within the API key's team. An already imported
        URL returns 409 with the existing podcast identity. An active import
        without a podcast yet returns its existing run with 202. Other teams
        import independently. Failed or cancelled imports can be attempted
        again.
      operationId: importRSS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRSSRequest"
      security:
        - ApiKeyAuth: []
      responses:
        "202":
          description: New import accepted, or an active import that has not created a
            podcast yet returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedPublicRSSImport"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "402":
          description: "402"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RSSImportEntitlementError"
        "403":
          description: API key is missing the show:create scope.
        "409":
          description: show_already_imported identifies the existing podcast for this
            team's RSS URL using show_id, show_slug and team_id.
            show_identity_conflict means a requested globally unique slug is
            already used or differs from the slug choice retained by a partially
            failed import. No import was started or changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastCreationConflict"
  /s/rss-imports/{import_run_id}/events:
