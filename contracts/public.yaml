      security:
        - ApiKeyAuth: []
      responses:
        "204":
          description: Package fenced and cleanup requested.
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "409":
          description: Completed packages cannot be cancelled.
  /s/episode-packages/{upload_session_id}/objects/{object_index}/parts:
    parameters:
      - name: upload_session_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UploadSessionID"
    post:
      description: Sign additional storage parts or renew expired signatures. Normal
        audio uploads use the signature returned by admission.
      operationId: presignEpisodePackageParts
      parameters:
        - name: object_index
          in: path
          required: true
          schema:
            minimum: 0
            maximum: 99999
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignEpisodeUploadSessionParts"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignedEpisodeUploadParts"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "409":
          description: Package is no longer writable.
        "423":
          $ref: "#/components/responses/YouTubeSyncStoppedResponse"
  /s/episode-packages/{upload_session_id}/complete:
    parameters:
      - name: upload_session_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UploadSessionID"
    post:
      operationId: completeEpisodePackage
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodePackage"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "409":
          description: Package is incomplete or no longer writable.
        "423":
          $ref: "#/components/responses/YouTubeSyncStoppedResponse"
  /s/episode-upload-sessions:
    post:
      description: Idempotently admits a resumable source upload without creating an
        episode.
      operationId: createEpisodeUploadSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEpisodeUploadSession"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeUploadSession"
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeUploadSession"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing the episode:create scope.
        "404":
          description: Show slug was not found for the API key team.
        "409":
          description: Source identity conflicts with the existing session.
        "410":
          description: The resumable upload attempt expired.
  /s/episode-upload-sessions/{upload_session_id}:
    parameters:
      - name: upload_session_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UploadSessionID"
    get:
      operationId: getEpisodeUploadSession
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeUploadSession"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "404":
          description: Episode upload session was not found.
        "410":
          description: The resumable upload session expired.
    put:
      operationId: updateEpisodeUploadSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchEpisodeUploadSession"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeUploadSession"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "404":
          description: Episode upload session was not found.
        "409":
          description: Session metadata can no longer be changed.
        "410":
          description: The resumable upload session expired.
    delete:
      description: Terminalizes a failed or abandoned intake and schedules durable
        object-store cleanup.
      operationId: cancelEpisodeUploadSession
      security:
        - ApiKeyAuth: []
      responses:
        "204":
          description: Upload session cancelled.
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "404":
          description: Episode upload session was not found.
        "409":
          description: Upload session already entered processing.
  /s/episode-upload-sessions/{upload_session_id}/parts/presign:
    post:
      operationId: presignEpisodeUploadSessionParts
      parameters:
        - name: upload_session_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UploadSessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignEpisodeUploadSessionParts"
      security:
        - ApiKeyAuth: []
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignedEpisodeUploadParts"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "402":
          description: An audio plan is required to upload files.
        "404":
          description: Episode upload session was not found.
        "409":
          description: Attempt is no longer accepting upload parts.
        "410":
          description: The resumable upload attempt expired.
  /s/episode-upload-sessions/{upload_session_id}/complete:
    post:
      description: Completes multipart upload from authoritative object-store
        ListParts state and starts durable processing.
      operationId: completeEpisodeUploadSession
      parameters:
        - name: upload_session_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UploadSessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteEpisodeUploadSession"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: Publishing requires the episode:publish API key scope.
        "404":
          description: Episode upload session was not found.
        "409":
          description: Authoritative multipart parts are incomplete or invalid.
        "410":
          description: The resumable upload attempt expired.
  /s/episode-upload-sessions/{upload_session_id}/events:
    get:
      operationId: episodeUploadSessionEvents
      parameters:
        - name: upload_session_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UploadSessionID"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Progress plus the durable safe-handoff or permanent-failure
            milestone.
          content:
            text/event-stream:
              itemSchema:
                $ref: "#/components/schemas/EpisodeProcessingEvent"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "404":
          description: Episode upload session was not found.
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      description: Listenbox API key scoped to podcast management.
      scheme: bearer
  responses:
    YouTubeSyncStoppedResponse:
      description: The server has disabled importing for this show. Stop the entire
        show sync, preserve its journal, and refresh the importing-show catalog.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/YouTubeSyncStopped"
  headers:
    ETag:
      description: HTTP entity tag for the selected OpenAPI representation.
      schema:
        type: string
      required: true
    Vary:
      description: The representation varies by the Accept request header.
      schema:
        type: string
        const: Accept
      required: true
  schemas:
    OpenAPIYAMLDocument:
      type: string
      description: Generated OpenAPI YAML document.
    OpenAPIJSONDocument:
      description: Generated OpenAPI JSON document.
      type: object
      properties: {}
      additionalProperties: false
    NonEmptyString:
      type: string
      minLength: 1
    ValidationLocation:
      type: string
      enum:
        - body
        - query
        - path
        - header
        - cookie
    string:
      type: string
    ValidationIssueCode:
      type: string
      description: Stable machine-readable validation failure code. Uses invalid,
        parse, required, JSON Schema keyword names, additionalProperties for
        unknown object fields, and format.<format> for named format failures.
      examples:
        - required
        - minLength
        - format.uri
        - additionalProperties
    ValidationIssue:
      type: object
      properties:
        in:
          $ref: "#/components/schemas/ValidationLocation"
        field:
          type: string
        path:
          type: array
          items:
            $ref: "#/components/schemas/string"
        code:
          $ref: "#/components/schemas/ValidationIssueCode"
        message:
          $ref: "#/components/schemas/NonEmptyString"
      required:
        - in
        - code
        - message
      additionalProperties: false
    ValidationErr:
      type: object
      properties:
        message:
          $ref: "#/components/schemas/NonEmptyString"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
          minItems: 0
      required:
        - message
        - errors
      additionalProperties: false
    AuthorizationClient:
      type: string
      enum:
        - cli
        - desktop
      description: The Listenbox app requesting authorization; controls consent copy,
        not permissions.
    ApiKeyScope:
      type: string
      enum:
        - team:read
        - team:manage
        - show:read
        - show:create
        - show:update
        - episode:create
        - episode:delete
        - episode:update
        - episode:publish
    CreateCLIAuthorization:
      type: object
      properties:
        client:
          $ref: "#/components/schemas/AuthorizationClient"
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
          minItems: 1
      required:
        - client
        - scopes
      additionalProperties: false
    CLIAuthorizationCode:
      type: string
      pattern: ^cla_[A-Za-z0-9_-]+$
    CreatedCLIAuthorization:
      type: object
      properties:
        code:
          $ref: "#/components/schemas/CLIAuthorizationCode"
        verification_url:
          type: string
          format: uri
          pattern: ^https?://\S+$
        credential:
          type: string
          description: Pending API key credential. It remains inactive until approval.
          pattern: ^apk_[a-f0-9]{32}\.[A-Za-z0-9_-]{22}$
      required:
        - code
        - verification_url
        - credential
      additionalProperties: false
    CLIAuthorizationPendingEvent:
      type: object
      properties:
        type:
          type: string
          const: cli.authorization.pending
        verification_url:
          type: string
          description: Absolute browser URL for this fresh authorization attempt.
          format: uri
          pattern: ^https?://\S+$
        credential:
          type: string
          description: Pending API key credential. It remains inactive until approval.
          pattern: ^apk_[a-f0-9]{32}\.[A-Za-z0-9_-]{22}$
      required:
        - type
        - verification_url
        - credential
      additionalProperties: false
    TeamID:
      type: string
      pattern: ^team_
    CLIAuthorizationApprovedEvent:
      type: object
      properties:
        type:
          type: string
          const: cli.authorization.approved
        team_id:
          $ref: "#/components/schemas/TeamID"
      required:
        - type
        - team_id
      additionalProperties: false
    CLIAuthorizationDeniedEvent:
      type: object
      properties:
        type:
          type: string
          const: cli.authorization.denied
      required:
        - type
      additionalProperties: false
    CLIAuthorizationExpiredEvent:
      type: object
      properties:
        type:
          type: string
          const: cli.authorization.expired
      required:
        - type
      additionalProperties: false
    CLIAuthorizationEvent:
      oneOf:
        - type: object
          properties:
            event:
              type: string
              const: cli.authorization.pending
            data:
              type: string
              contentMediaType: application/json
              contentSchema:
                $ref: "#/components/schemas/CLIAuthorizationPendingEvent"
            id:
              type: string
            retry:
              minimum: 0
              type: integer
          required:
            - event
            - data
          additionalProperties: false
        - type: object
          properties:
            event:
              type: string
              const: cli.authorization.approved
            data:
              type: string
              contentMediaType: application/json
              contentSchema:
                $ref: "#/components/schemas/CLIAuthorizationApprovedEvent"
            id:
              type: string
            retry:
              minimum: 0
              type: integer
          required:
            - event
            - data
          additionalProperties: false
        - type: object
          properties:
            event:
              type: string
              const: cli.authorization.denied
            data:
              type: string
              contentMediaType: application/json
              contentSchema:
                $ref: "#/components/schemas/CLIAuthorizationDeniedEvent"
            id:
              type: string
            retry:
              minimum: 0
              type: integer
          required:
            - event
            - data
          additionalProperties: false
        - type: object
          properties:
            event:
              type: string
              const: cli.authorization.expired
            data:
              type: string
              contentMediaType: application/json
              contentSchema:
                $ref: "#/components/schemas/CLIAuthorizationExpiredEvent"
            id:
              type: string
            retry:
              minimum: 0
              type: integer
          required:
            - event
            - data
          additionalProperties: false
    ApiKeyID:
      type: string
      pattern: ^apk_
    APIKeyWhoami:
      type: object
      properties:
        email:
          type: string
          format: email
        id:
          $ref: "#/components/schemas/ApiKeyID"
        name:
          $ref: "#/components/schemas/NonEmptyString"
        team_id:
          $ref: "#/components/schemas/TeamID"
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
          minItems: 1
      required:
        - email
        - id
        - team_id
        - scopes
      additionalProperties: false
    UserID:
      type: string
      pattern: ^usr_
    User:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UserID"
        email:
          type: string
          format: email
        name:
          $ref: "#/components/schemas/NonEmptyString"
        picture_url:
          type: string
          format: uri
      required:
        - id
        - email
      additionalProperties: false
    TeamRole:
      type: string
      enum:
        - owner
        - write
        - read
    UnixMillis:
      description: UNIX epoch milliseconds.
      minimum: 0
      type: integer
      format: int64
    TeamMember:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        role:
          $ref: "#/components/schemas/TeamRole"
        joined_at:
          $ref: "#/components/schemas/UnixMillis"
