    CreateEpisodePackage:
      type: object
      properties:
        show_slug:
          $ref: "#/components/schemas/ShowSlug"
        youtube_url:
          type: string
          maxLength: 2048
          description: The canonical show linkage observed by this scan. Admission rejects
            a changed linkage or an active destination.
          format: uri
          pattern: ^https?://\S+$
        source_url:
          type: string
          maxLength: 2048
          description: Canonical URL of one source item, for example
            https://www.youtube.com/watch?v=abcdefghijk. This URL is the
            deduplication identity within the show. Repeating admission for an
            already-published source returns its completed package, without
            publishing a duplicate. Full URLs keep this identity usable for
            future source providers.
          format: uri
          pattern: ^https?://\S+$
        operation_id:
          type: string
          format: uuid
          description: "Client-generated UUID for this transfer, saved before admission
            and reused after interruption. An unfinished transfer belongs to
            this operation: a different operation for the same source receives
            409. Replaying the same immutable manifest and operation resumes the
            package; after server expiry it can admit a new session.
            Completed-source deduplication is independent of this UUID."
        title:
          type: string
          minLength: 1
          maxLength: 1000
        description:
          type: string
          maxLength: 100000
        duration_seconds:
          minimum: 1
          maximum: 604800
          type: integer
          format: int64
        published_at:
          minimum: 1
          maximum: 253402300799999
          description: The source item's real publication time, in Unix milliseconds. It
            becomes the episode's RSS pubDate. Sync and reordering never replace
            it with the current time.
          type: integer
          format: int64
        objects:
          type: array
          items:
            $ref: "#/components/schemas/PreparedMediaObject"
          minItems: 1
          maxItems: 100000
          description: Immutable manifest of client-owned prepared files. The client
            preserves these files unchanged until upload finishes and reuses
            this saved manifest when resuming or renewing signed URLs, without
            hashing media. An audio show accepts one audio.m4a object
            (audio/mp4). A video show requires both video.mp4 (video/mp4) and
            audio.m4a (audio/mp4), plus a complete relative HLS package rooted
            at hls/master.m3u8. Both progressive outputs are mandatory
            regardless of configured RSS feeds, belong to the episode media
            version, and are published atomically. Creating or deleting an RSS
            feed does not generate or delete media. The client processes media
            locally and uploads signed parts directly to storage; the server
            validates object lengths, content types and HLS structure before
            publication.
      required:
        - show_slug
        - youtube_url
        - source_url
        - operation_id
        - title
        - duration_seconds
        - published_at
        - objects
      additionalProperties: false
