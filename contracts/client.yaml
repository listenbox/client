openapi: 3.2.0
info:
  title: Listenbox Client Config Schema
  version: "1"
paths: {}
components:
  schemas:
    ClientConfig:
      type: object
      properties:
        api_origin:
          type: string
          description: Listenbox public API origin shared by the CLI and desktop.
          format: uri
          pattern: ^https?://\S+$
        dashboard_origin:
          type: string
          description: Listenbox Dashboard origin shared by the CLI and desktop.
          format: uri
          pattern: ^https?://\S+$
      required:
        - api_origin
        - dashboard_origin
      additionalProperties: false
