[workspace]
resolver = "3"
members = ["crates/youtubei", "crates/sync-engine", "crates/cli", "crates/desktop"]
default-members = ["crates/cli", "crates/desktop"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/listenbox/client"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"

[profile.profiling]
inherits = "release"
debug = 1
strip = false
split-debuginfo = "packed"
