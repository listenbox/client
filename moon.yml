language: go
layer: configuration
toolchains:
  default: go
tags: [client-workspace, go-lint]
fileGroups:
  version: [VERSION]
  contracts: [contracts/*.yaml, .cache/public.openapi.yaml]
  notices: [LICENSE, THIRD-PARTY-NOTICES.txt]
  sources:
    - '*.go'
    - internal/**/*.go
    - crates/**/*.go
    - crates/**/*.sql
    - crates/**/tests/fixtures/**/*
    - crates/desktop/assets/**/*
    - crates/desktop/mygo.template.json
    - third_party/youtubejs/src/**/*
    - third_party/youtubejs/protos/generated/**/*
    - third_party/youtubejs/package.json
    - third_party/youtubejs/tsconfig.json
    - third_party/*.go
    - third_party/*.sh
    - third_party/*.yaml
    - third_party/package.json
    - third_party/moon.yml
    - tools/**/*.sh
    - tools/**/*.ps1
    - tools/**/*.mjs
    - tools/**/*.iss
    - go.mod
    - go.sum
    - .golangci.yaml
    - contracts/*.yaml
    - VERSION
    - mise.toml
    - mise.lock
    - .moon/**/*.yml
    - moon.yml
taskOptions:
  cache: true
tasks:
  outdated:
    command: mise exec -- go list -u -m all
    options:
      runInCI: false
  codegen:
    deps: [~:public-contract]
    command: [mise, exec, --, bash, tools/codegen.sh]
    inputs: ['@group(contracts)', go.mod, go.sum, tools/codegen.sh]
    outputs: [crates/sync-engine/publicapi/*.go, crates/sync-engine/clientconfig/*.go]
    options:
      internal: true
      shell: false
  public-contract:
    description: Download the public API contract without access to the private specification sources.
    command: [mise, exec, --, node, --input-type=module, -e]
    args:
      - |
        import {mkdir,rename,rm,writeFile} from "node:fs/promises";
        const url="https://v1.listenbox.app/";
        const response=await fetch(url,{headers:{Accept:"text/yaml"},signal:AbortSignal.timeout(15000)});
        if(!response.ok)throw Error(`Download public OpenAPI contract: ${response.status} ${response.statusText}`);
        const document=await response.text();
        if(!/^openapi: 3\.[12]\.0\s*$/m.test(document))throw Error(`No supported OpenAPI document returned by ${url}`);
        await mkdir(".cache",{recursive:true});
        const temporary=".cache/public.openapi.yaml.tmp";
        try{
          await writeFile(temporary,document,{mode:0o600});
          await rename(temporary,".cache/public.openapi.yaml");
        }finally{await rm(temporary,{force:true});}
    inputs: [moon.yml]
    outputs: [.cache/public.openapi.yaml]
    options:
      shell: false
      cacheLifetime: 1 day
  native-ffmpeg:
    deps: [~:native-setup]
    command: mise exec -- go run ./internal/nativebuild/cmd
    inputs: [internal/nativebuild/**/*.go, moon.yml, mise.toml, mise.lock]
    outputs: [.cache/ffmpeg/**/*]
  native-setup:
    command: mise exec -- go run ./internal/nativebuild/cmd -check
    inputs: [internal/nativebuild/**/*.go, mise.toml, mise.lock]
    options:
      cache: false
      internal: true
  prerequisites:
    deps: [~:codegen, ~:native-ffmpeg, youtubejs:bundle]
    inputs: []
    options:
      internal: true
  lint:
    deps: [~:prerequisites, ~:lint-shell]
    inputs: ['@group(sources)']
  lint-fix:
    extends: lint
    env:
      GO_LINT_FORMATTERS: golines
    options:
      cache: false
      runInCI: false
  lint-shell:
    script: mise exec -- shellcheck third_party/*.sh tools/*.sh
    inputs: [third_party/*.sh, tools/*.sh]
    options:
      cache: true
  test:
    deps: [~:prerequisites]
    inputs: ['@group(sources)']
    script: mise exec -- go test -count=1 -timeout=30s ./...
  build:
    deps: [cli:build, desktop:build]
    inputs: []
  check:
    deps: [~:lint, ~:test, ~:build]
    inputs: []
    options:
      runInCI: false
  build-release:
    deps: [cli:build-release, desktop:build-release]
    inputs: ['@group(sources)']
    options:
      runInCI: false
  package:
    deps: [desktop:dmg]
    inputs: ['@group(sources)', '@group(notices)']
    options:
      runInCI: false
      os: macos
  updaters:
    command: mise exec -- node tools/updaters.mjs
    inputs: [tools/updaters.mjs]
    outputs: [.cache/updaters/**/*]
    options:
      os: [macos, windows]
      runInCI: false
  release-validate:
    command: mise exec -- bash tools/release-validate.sh
    inputs: [tools/release-validate.sh, tools/release.mjs, VERSION]
    options:
      cache: false
  release-publish:
    command: mise exec -- node tools/release.mjs publish artifacts
    inputs: []
    options:
      cache: false
      runInCI: false
  release-next:
    command: mise exec -- bash tools/release-next.sh
    inputs: []
    options:
      cache: false
      runInCI: false
  release-dispatch:
    command: mise exec -- bash tools/release-dispatch.sh
    inputs: []
    options:
      cache: false
      runInCI: false
