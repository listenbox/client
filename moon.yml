language: rust
layer: configuration
toolchains:
  default: rust
env:
  CARGO_TERM_COLOR: always
tags: [client-workspace]
fileGroups:
  notices: [LICENSE, THIRD-PARTY-NOTICES.txt]
  macos-install-tools: [tools/reinstall-macos*.swift]
  sources:
    - crates/**/*.rs
    - crates/**/*.sql
    - crates/**/Cargo.toml
    - crates/**/tests/**/*
    - crates/**/benches/**/*
    - tools/**/*.rs
    - tools/**/*.ps1
    - crates/desktop/assets/**/*
    - Cargo.toml
    - Cargo.lock
    - rust-toolchain.toml
    - .cargo/config.toml
    - .config/nextest.toml
    - .moon/**/*.yml
    - moon.yml
taskOptions:
  cache: true
tasks:
  secrets:
    command: bash tools/check-secrets.sh
    inputs: []
    options:
      cache: false
      runInCI: always
  native-ffmpeg:
    inputs: [tools/native-ffmpeg.rs, rust-toolchain.toml]
    script: |-
      set -euo pipefail
      mkdir -p .cache
      rustc --edition 2024 tools/native-ffmpeg.rs -o .cache/native-ffmpeg
      .cache/native-ffmpeg
    outputs: [.cache/ffmpeg/**/*]
  prerequisites:
    deps: [~:native-ffmpeg, ~:codegen]
    inputs: []
    options:
      internal: true
  codegen:
    inputs: []
    options:
      internal: true
  native-ffmpeg-windows-x64:
    command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/build-windows.ps1 -Architecture x64 -Stage FFmpeg
    inputs: [tools/native-ffmpeg.rs, tools/build-windows.ps1, rust-toolchain.toml]
    outputs: [.cache/ffmpeg-x86_64-pc-windows-msvc/**/*]
    options:
      os: windows
      runInCI: false
  native-ffmpeg-windows-arm64:
    command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/build-windows.ps1 -Architecture arm64 -Stage FFmpeg
    inputs: [tools/native-ffmpeg.rs, tools/build-windows.ps1, rust-toolchain.toml]
    outputs: [.cache/ffmpeg-aarch64-pc-windows-msvc/**/*]
    options:
      os: windows
      runInCI: false
  lint:
    deps: [~:prerequisites]
    inputs: ["@group(sources)", tools/**/*.sh]
    script: |-
      set -euo pipefail
      cargo fmt --all
      rustfmt --edition 2024 tools/*.rs
      pkgx shellcheck tools/*.sh
      pkgx +llvm.org +cmake.org cargo clippy --locked --workspace --all-targets -- -D warnings
  build:
    deps: [cli:build, desktop:build]
    inputs: []
  test:
    deps: [cli:test, client-engine:test, client-youtubei:test, desktop:test]
    inputs: []
  check:
    deps: [~:secrets, ~:lint, ~:test, ~:build]
    inputs: []
    options:
      runInCI: false
  package:
    deps: [~:build-release]
    inputs: ["@group(sources)", LICENSE, THIRD-PARTY-NOTICES.txt]
    script: |-
      set -euo pipefail
      cp .cache/ffmpeg/NOTICE.txt dist/release/FFmpeg-NOTICE.txt
      COPYFILE_DISABLE=1 tar -czf dist/listenbox-client.tar.gz -C dist/release listenbox listenbox-desktop FFmpeg-NOTICE.txt -C ../.. LICENSE THIRD-PARTY-NOTICES.txt
    outputs: [dist/listenbox-client.tar.gz]
    options:
      runInCI: false
  build-release:
    deps: [desktop:build-release]
    inputs: ['@group(sources)']
    script: |-
      set -euo pipefail
      pkgx +llvm.org +cmake.org cargo build --locked --release -p listenbox
      mkdir -p dist/release
      cp target/release/listenbox dist/release/
      cp crates/desktop/dist/release/listenbox-desktop dist/release/listenbox-desktop
    outputs: [dist/release/listenbox, dist/release/listenbox-desktop]
    options:
      runInCI: false
  outdated:
    command: cargo update --dry-run
    options:
      runInCI: false
